name: Native CLI acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin/arm64
            label: darwin_arm64
            executable: pieces-export
          - runner: macos-15-intel
            target: darwin/amd64
            label: darwin_amd64
            executable: pieces-export
          - runner: ubuntu-24.04
            target: linux/amd64
            label: linux_amd64
            executable: pieces-export
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            label: linux_arm64
            executable: pieces-export
          - runner: windows-2025
            target: windows/amd64
            label: windows_amd64
            executable: pieces-export.exe
          - runner: windows-11-arm
            target: windows/arm64
            label: windows_arm64
            executable: pieces-export.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Confirm native architecture
        shell: bash
        run: test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.target }}'
      - name: Tests and vet
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Race tests on supported runners
        if: matrix.label != 'windows_arm64'
        shell: bash
        run: go test -race ./...
      - name: Windows PowerShell 5.1 installer acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PIECES_EXPORT_TEST_POWERSHELL = 'powershell.exe'
          go test ./install -run '^TestPowerShellInstaller$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency vulnerability scan
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build native download
        shell: bash
        run: go run ./cmd/release --version "$RELEASE_VERSION" --targets '${{ matrix.target }}'
      - name: Run packaged binary end to end
        shell: bash
        env:
          PIECES_EXPORT_TEST_BINARY: ${{ github.workspace }}/dist/pieces-export_${{ env.RELEASE_VERSION }}_${{ matrix.label }}/${{ matrix.executable }}
        run: go test ./internal/exporter -run '^TestPackaged(CLI|CacheCLI)$' -count=1 -v
      - name: Retain binary-only acceptance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# Synthetic loopback fixtures only. A green matrix does not replace actual
# installed-OS export, lifecycle, or Finder/Explorer/Dolphin viewer acceptance.
# This workflow does not publish binaries, make source public, or change IAM.
