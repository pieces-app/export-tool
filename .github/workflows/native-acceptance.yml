name: Native CLI acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin/arm64
            label: darwin_arm64
            executable: pieces-export
          - runner: macos-15-intel
            target: darwin/amd64
            label: darwin_amd64
            executable: pieces-export
          - runner: ubuntu-24.04
            target: linux/amd64
            label: linux_amd64
            executable: pieces-export
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            label: linux_arm64
            executable: pieces-export
          - runner: windows-2025
            target: windows/amd64
            label: windows_amd64
            executable: pieces-export.exe
          - runner: windows-11-arm
            target: windows/arm64
            label: windows_arm64
            executable: pieces-export.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Confirm native architecture
        shell: bash
        run: test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.target }}'
      - name: Tests and vet
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Race tests on supported runners
        if: matrix.label != 'windows_arm64'
        shell: bash
        run: go test -race ./...
      - name: Windows PowerShell 5.1 installer acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PIECES_EXPORT_TEST_POWERSHELL = 'powershell.exe'
          go test ./install -run '^TestPowerShellInstaller$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency vulnerability scan
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build native download
        shell: bash
        run: go run ./cmd/release --version "$RELEASE_VERSION" --targets '${{ matrix.target }}'
      - name: Run packaged binary end to end
        shell: bash
        env:
          PIECES_EXPORT_TEST_BINARY: ${{ github.workspace }}/dist/pieces-export_${{ env.RELEASE_VERSION }}_${{ matrix.label }}/${{ matrix.executable }}
        # Select all compiled-CLI regressions, including current junctions,
        # missing owners, recovery, and paginated navigation. Dedicated installer
        # and disk-full jobs below provide their required transport/volume inputs.
        run: go test ./internal/exporter -run '^TestPackaged.*CLI$' -count=1 -v
      - name: Install actual release through local HTTPS
        if: runner.os != 'Windows'
        shell: bash
        env:
          PIECES_EXPORT_TEST_RELEASE: ${{ github.workspace }}/dist
          PIECES_EXPORT_TEST_VERSION: ${{ env.RELEASE_VERSION }}
        run: go test -race ./internal/exporter -run '^TestPackagedBashInstaller$' -count=1 -v
      - name: Install actual release with PowerShell 5.1 and 7
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PIECES_EXPORT_TEST_RELEASE: ${{ github.workspace }}/dist
          PIECES_EXPORT_TEST_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            $env:PIECES_EXPORT_TEST_POWERSHELL = $shell
            go test ./internal/exporter -run '^TestPackagedPowerShellInstaller$' -count=1 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Linux isolated disk-full acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          enospc_tests=$(mktemp -d "$RUNNER_TEMP/pieces-export-enospc.XXXXXX")
          CGO_ENABLED=0 go test -c -o "$enospc_tests/exporter.test" ./internal/exporter
          docker run --rm --platform '${{ matrix.target }}' \
            --network none --read-only --cpus=2 --memory=512m \
            --tmpfs /tmp:rw,size=128m --tmpfs /enospc:rw,size=8m \
            --mount type=bind,source="$enospc_tests",target=/tests,readonly \
            --mount type=bind,source="$PWD/dist/pieces-export_${RELEASE_VERSION}_${{ matrix.label }}",target=/app,readonly \
            --env PIECES_EXPORT_ENOSPC_ROOT=/enospc \
            --env PIECES_EXPORT_TEST_BINARY=/app/pieces-export \
            debian@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            /tests/exporter.test \
            -test.run '^Test(ActualENOSPCLeavesUnfinalizedArchive|PackagedDiskFullCLI)$' -test.v
      - name: Retain binary-only acceptance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# Synthetic loopback fixtures only. A green matrix does not replace actual
# installed-OS export, lifecycle, or Finder/Explorer/Dolphin viewer acceptance.
# This workflow does not publish binaries, make source public, or change IAM.
